<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم الدراسة الشامل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1, h2 { color: #2c3e50; margin-top: 0; }
        h1 { text-align: center; font-size: 1.6em; }
        h2 { font-size: 1.2em; border-bottom: 2px solid #ecf0f1; padding-bottom: 8px; margin-top: 25px; }
        .stats {
            display: flex; justify-content: space-around; background: #2c3e50;
            color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px;
        }
        .stat-box { text-align: center; }
        .stat-value { font-size: 1.4em; font-weight: bold; color: #f1c40f; margin-top: 5px; }
        .timer-section { text-align: center; margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 12px; }
        #timer-display { font-size: 2.6em; font-weight: bold; margin-bottom: 10px; font-family: monospace; color: #2c3e50; }
        #screen-status { font-size: 0.85em; color: #27ae60; margin-bottom: 10px; display: none; font-weight: bold; }
        #study-btn {
            width: 100%; padding: 14px; font-size: 1.1em; font-weight: bold;
            color: white; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s;
        }
        .btn-stopped { background-color: #34495e; }
        .btn-running { background-color: #27ae60; }
        input, select, textarea {
            width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 10px;
            border: 1px solid #dcdde1; border-radius: 8px; box-sizing: border-box; font-family: inherit;
        }
        .row-inputs { display: flex; gap: 8px; }
        .row-inputs > * { flex: 1; }
        .add-btn {
            background-color: #2980b9; color: white; border: none; padding: 10px;
            border-radius: 8px; cursor: pointer; width: 100%; font-size: 1em; font-weight: bold;
        }
        ul { list-style-type: none; padding: 0; margin-top: 10px; }
        li {
            background: #f9f9f9; padding: 12px; margin-bottom: 8px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            border-right: 4px solid #2980b9; font-size: 0.95em;
        }
        li.completed { text-decoration: line-through; color: #888; background: #e8f8f5; border-right-color: #27ae60; }
        .delete-btn {
            background: #e74c3c; color: white; border: none; padding: 5px 10px;
            border-radius: 5px; cursor: pointer; font-size: 0.85em; margin-right: 10px;
        }
        .badge { background: #e1f5fe; color: #0288d1; padding: 3px 8px; border-radius: 5px; font-size: 0.85em; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 منظم دراستي الشامل</h1>

    <div class="stats">
        <div class="stat-box">
            <div>النقاط الكلية 🏆</div>
            <div class="stat-value" id="points-display">0</div>
        </div>
        <div class="stat-box">
            <div>دراسة اليوم ⏱️</div>
            <div class="stat-value" id="daily-time-display">0 د</div>
        </div>
    </div>

    <div class="timer-section">
        <div id="timer-display">00:00:00</div>
        <div id="screen-status">💡 الشاشة ستبقى مضاءة أثناء الدراسة</div>
        <button id="study-btn" class="btn-stopped" onclick="toggleTimer()">ابدأ الدراسة</button>
    </div>

    <h2>📝 برنامج ومهام اليوم</h2>
    <input type="text" id="task-input" placeholder="أضف مادة أو درساً لليوم...">
    <button class="add-btn" onclick="addTask()">إضافة لبرنامج اليوم</button>
    <ul id="task-list"></ul>

    <h2>📅 مخطط الشهر (اختر اليوم والتاريخ)</h2>
    <div class="row-inputs">
        <input type="date" id="month-date">
        <input type="text" id="month-subject" placeholder="المادة المطلوبة...">
    </div>
    <button class="add-btn" onclick="addMonthPlan()">حفظ في جدول الشهر</button>
    <ul id="month-list"></ul>

    <h2>🗓️ الجدول الأسبوعي وساعات الفراغ</h2>
    <select id="week-day">
        <option value="السبت">السبت</option>
        <option value="الأحد">الأحد</option>
        <option value="الإثنين">الإثنين</option>
        <option value="الثلاثاء">الثلاثاء</option>
        <option value="الأربعاء">الأربعاء</option>
        <option value="الخميس">الخميس</option>
        <option value="الجمعة">الجمعة</option>
    </select>
    <div class="row-inputs">
        <input type="text" id="study-hours" placeholder="الدراسة (مثلاً: 4 لـ 8)">
        <input type="text" id="break-time" placeholder="الاستراحة (مثلاً: 6 م)">
    </div>
    <input type="text" id="free-hours" placeholder="كم ساعة فاضي بهذا اليوم؟ (مثلاً: 3 ساعات)">
    <button class="add-btn" onclick="addWeekPlan()">إضافة للجدول الأسبوعي</button>
    <ul id="week-list"></ul>

    <h2>🎯 أهدافي الدراسية</h2>
    <textarea id="goals-input" rows="3" placeholder="اكتب أهدافك العامة هنا..." oninput="saveGoals()"></textarea>
</div>
<script>
    let isStudying = false;
    let seconds = 0;
    let timerInterval;
    let wakeLock = null;

    const todayDateStr = new Date().toDateString();
    const savedDateStr = localStorage.getItem('lastStudyDate');
    let dailySeconds = parseInt(localStorage.getItem('dailyStudySeconds')) || 0;

    if (savedDateStr !== todayDateStr) {
        dailySeconds = 0;
        localStorage.setItem('dailyStudySeconds', 0);
        localStorage.setItem('lastStudyDate', todayDateStr);
    }

    let points = parseInt(localStorage.getItem('studyPoints')) || 0;
    let tasks = JSON.parse(localStorage.getItem('studyTasks')) || [];
    let monthPlans = JSON.parse(localStorage.getItem('monthPlans')) || [];
    let weekPlans = JSON.parse(localStorage.getItem('weekPlans')) || [];
    let goals = localStorage.getItem('studyGoals') || '';

    document.getElementById('points-display').innerText = points;
    document.getElementById('goals-input').value = goals;
    updateDailyTimeDisplay();
    renderTasks();
    renderMonthPlans();
    renderWeekPlans();

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                document.getElementById('screen-status').style.display = 'block';
            }
        } catch (err) {}
    }

    function releaseWakeLock() {
        if (wakeLock !== null) {
            wakeLock.release().then(() => {
                wakeLock = null;
                document.getElementById('screen-status').style.display = 'none';
            });
        }
    }

    function toggleTimer() {
        const btn = document.getElementById('study-btn');
        if (!isStudying) {
            isStudying = true;
            btn.innerText = "جاري الدراسة... (اضغط للإنهاء)";
            btn.className = "btn-running";
            requestWakeLock();
            timerInterval = setInterval(() => {
                seconds++;
                updateTimerDisplay();
            }, 1000);
        } else {
            isStudying = false;
            clearInterval(timerInterval);
            btn.innerText = "ابدأ الدراسة";
            btn.className = "btn-stopped";
            releaseWakeLock();

            dailySeconds += seconds;
            let earnedPoints = Math.floor(seconds / 60) * 10;
            if (seconds > 5 && earnedPoints === 0) earnedPoints = 5;
            points += earnedPoints;
            
            localStorage.setItem('dailyStudySeconds', dailySeconds);
            localStorage.setItem('lastStudyDate', new Date().toDateString());
            localStorage.setItem('studyPoints', points);
            
            seconds = 0;
            updateTimerDisplay();
            updateDailyTimeDisplay();
            document.getElementById('points-display').innerText = points;
        }
    }
    function updateTimerDisplay() {
        let hrs = Math.floor(seconds / 3600);
        let mins = Math.floor((seconds % 3600) / 60);
        let secs = seconds % 60;
        document.getElementById('timer-display').innerText = 
            `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateDailyTimeDisplay() {
        let totalMins = Math.floor(dailySeconds / 60);
        let hrs = Math.floor(totalMins / 60);
        let mins = totalMins % 60;
        document.getElementById('daily-time-display').innerText = hrs > 0 ? `${hrs} س ${mins} د` : `${mins} د`;
    }

    function addTask() {
        const input = document.getElementById('task-input');
        if (input.value.trim() === '') return;
        tasks.push({ text: input.value.trim(), completed: false });
        input.value = '';
        localStorage.setItem('studyTasks', JSON.stringify(tasks));
        renderTasks();
    }

    function toggleTask(index) {
        tasks[index].completed = !tasks[index].completed;
        points += tasks[index].completed ? 50 : -50;
        localStorage.setItem('studyPoints', points);
        localStorage.setItem('studyTasks', JSON.stringify(tasks));
        document.getElementById('points-display').innerText = points;
        renderTasks();
    }

    function deleteTask(e, index) {
        e.stopPropagation();
        tasks.splice(index, 1);
        localStorage.setItem('studyTasks', JSON.stringify(tasks));
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('task-list');
        list.innerHTML = '';
        tasks.forEach((task, i) => {
            const li = document.createElement('li');
            li.className = task.completed ? 'completed' : '';
            li.onclick = () => toggleTask(i);
            li.innerHTML = `<span>${task.completed ? '✅ ' : '⬜ '} ${task.text}</span>
                            <button class="delete-btn" onclick="deleteTask(event, ${i})">حذف</button>`;
            list.appendChild(li);
        });
    }

    function addMonthPlan() {
        const dateVal = document.getElementById('month-date').value;
        const subjVal = document.getElementById('month-subject').value.trim();
        if (!dateVal || !subjVal) return;
        monthPlans.push({ date: dateVal, subject: subjVal });
        document.getElementById('month-subject').value = '';
        localStorage.setItem('monthPlans', JSON.stringify(monthPlans));
        renderMonthPlans();
    }

    function deleteMonthPlan(index) {
        monthPlans.splice(index, 1);
        localStorage.setItem('monthPlans', JSON.stringify(monthPlans));
        renderMonthPlans();
    }

    function renderMonthPlans() {
        const list = document.getElementById('month-list');
        list.innerHTML = '';
        monthPlans.forEach((plan, i) => {
            const li = document.createElement('li');
            li.innerHTML = `<div><span class="badge">${plan.date}</span> <strong>${plan.subject}</strong></div>
                            <button class="delete-btn" onclick="deleteMonthPlan(${i})">حذف</button>`;
            list.appendChild(li);
        });
    }

    function addWeekPlan() {
        const day = document.getElementById('week-day').value;
        const study = document.getElementById('study-hours').value.trim();
        const rest = document.getElementById('break-time').value.trim();
        const free = document.getElementById('free-hours').value.trim();
        if (!study && !rest && !free) return;
        weekPlans.push({ day, study, rest, free });
        document.getElementById('study-hours').value = '';
        document.getElementById('break-time').value = '';
        document.getElementById('free-hours').value = '';
        localStorage.setItem('weekPlans', JSON.stringify(weekPlans));
        renderWeekPlans();
    }

    function deleteWeekPlan(index) {
        weekPlans.splice(index, 1);
        localStorage.setItem('weekPlans', JSON.stringify(weekPlans));
        renderWeekPlans();
    }

    function renderWeekPlans() {
        const list = document.getElementById('week-list');
        list.innerHTML = '';
        weekPlans.forEach((item, i) => {
            const li = document.createElement('li');
            li.innerHTML = `<div>
                                <span class="badge">${item.day}</span><br>
                                📚 دراسة: ${item.study || '-'} | ☕ استراحة: ${item.rest || '-'} | ⏳ فراغ: ${item.free || '-'}
                            </div>
                            <button class="delete-btn" onclick="deleteWeekPlan(${i})">حذف</button>`;
            list.appendChild(li);
        });
    }

    function saveGoals() {
        localStorage.setItem('studyGoals', document.getElementById('goals-input').value);
    }
</script>
</body>
</html>
